name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Proje klasorunu bul
        run: |
          DIR=$(dirname "$(find . -name build.gradle -not -path '*/.git/*' | head -n 1)")
          if [ "$DIR" = "." ] && [ ! -f build.gradle ]; then
            echo "build.gradle bulunamadi! Dosyalar yuklenmemis." ; ls -R ; exit 1
          fi
          echo "Proje klasoru: $DIR"
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - name: Derle
        run: |
          cd "$PROJ"
          gradle build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dropper-ab-jar
          path: "**/build/libs/*.jar"
