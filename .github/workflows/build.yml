name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew'e calisma izni ver
        run: chmod +x ./gradlew

      - name: Derle
        run: ./gradlew build --stacktrace

      - name: Jar dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: dropper-ab-jar
          path: build/libs/*.jar
